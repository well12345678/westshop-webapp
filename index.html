<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Профиль</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f5f6;background:#191c1f}
    *{box-sizing:border-box} body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 35%,#252a2f 0,#1c2024 34%,#191c1f 72%);display:grid;place-items:center;overflow:hidden}
    .app{width:min(100%,520px);min-height:100svh;padding:24px 20px 28px;display:flex;flex-direction:column;align-items:center}.top{width:100%;display:flex;justify-content:flex-end}.menu{width:44px;height:44px;border:1px solid #2c3135;border-radius:50%;background:#202428;color:#e3e6e8;font-size:25px;line-height:1;cursor:pointer;box-shadow:0 5px 18px #0005}
    .profile{width:100%;display:flex;flex-direction:column;align-items:center;margin-top:105px}.avatar{width:112px;height:112px;border-radius:50%;border:3px solid #1ca8f4;box-shadow:0 0 0 7px #1ca8f414,0 16px 45px #000b;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 35% 20%,#e0e5e8,#4a535b 24%,#111416 65%)}
    .avatar span{font-weight:900;font-size:38px;letter-spacing:-3px;color:#f5f7f8;transform:rotate(-9deg);text-shadow:0 2px 8px #000}.name{margin-top:18px;font-weight:800;font-size:20px;letter-spacing:-.2px}.handle{color:#8b949c;font-size:13px;margin-top:5px}
    .card{width:min(100%,390px);margin-top:28px;border:1px solid #343a3f;background:linear-gradient(145deg,#242b31,#202529);border-radius:17px;padding:23px 20px;text-align:center;box-shadow:0 10px 30px #0003}.card h2{font-size:12px;text-transform:uppercase;letter-spacing:1.8px;color:#7f8991;margin:0 0 11px}.card p{margin:0;color:#b4bbc1;font-size:14px;line-height:1.5}
    .footer{margin-top:auto;color:#5f686f;font-size:11px;letter-spacing:.3px}
    .stats{display:none}
    @media(min-width:700px){.app{width:100%;max-width:none}.profile{margin-top:105px}.avatar{width:124px;height:124px}.name{font-size:23px}}
  </style>
</head>
<body><main class="app"><div class="top"><button class="menu" aria-label="Меню">⋮</button></div><section class="profile"><div class="avatar" aria-label="Аватар"><span>W</span></div><div class="name">Ваше имя</div><div class="handle">@username</div><div class="stats"><div class="stat"><b>0</b><small>Заказов</small></div><div class="stat"><b>0</b><small>Избранное</small></div></div><div class="card"><h2>Профиль</h2><p>Здесь будет отображаться информация о пользователе и его заказах.</p></div></section><div class="footer">Telegram Mini App</div></main></body>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
tg?.requestFullscreen?.();
const user = tg?.initDataUnsafe?.user;
if (user) {
  document.querySelector('.name').textContent = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Пользователь';
  document.querySelector('.handle').textContent = user.username ? '@' + user.username : 'Без username';
  if (user.photo_url) {
    const avatar = document.querySelector('.avatar');
    avatar.textContent = '';
    avatar.style.background = `url("${user.photo_url}") center/cover no-repeat`;
  }
}
</script>
</html>
